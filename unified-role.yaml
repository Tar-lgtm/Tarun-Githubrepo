AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to create an IAM Role for EC2.

Resources:
  MyEC2Role:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'MyExampleEC2Role'
      Description: 'An example IAM role created via CloudFormation'
      
      # 1. Trust Policy: Determines who can assume this role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
              
      # 2. Managed Policies: Pre-built AWS or customer-managed policy ARNs
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'
        
      # 3. Inline Policies: Custom permissions defined right inside the role
      Policies:
        - PolicyName: 'S3WriteSpecificBucketPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource: 'arn:aws:s3:::my-target-bucket-name/*'

Outputs:
  RoleArn:
    Description: 'The ARN of the newly created IAM Role'
    Value: !GetAtt MyEC2Role.Arn
